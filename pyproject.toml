[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cerilog"
version = "0.1.0"
description = "A C-flavored HDL that transpiles to SystemVerilog or Verilog-2005"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
cerilog = "cerilog.__main__:main"

[tool.setuptools.packages.find]
include = ["cerilog*"]

[tool.setuptools.package-data]
"cerilog.parser" = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
