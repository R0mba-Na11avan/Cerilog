[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cerilog"
version = "0.1.0"
description = "A modern HDL that transpiles to SystemVerilog"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
cerilog = "src.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
